services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: sre_control_plane
      POSTGRES_USER: sre_control_plane
      POSTGRES_PASSWORD: sre_control_plane
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sre_control_plane -d sre_control_plane"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - sre-control-plane-postgres:/var/lib/postgresql/data

volumes:
  sre-control-plane-postgres:
