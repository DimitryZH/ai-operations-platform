[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-operations-sre-control-plane"
version = "0.1.0"
description = "Local runnable SRE control-plane skeleton for the accepted MVP contract."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.13,<2.0",
    "fastapi>=0.115,<1.0",
    "google-cloud-storage>=2.18,<4.0",
    "pydantic>=2.8,<3.0",
    "psycopg[binary]>=3.2,<4.0",
    "SQLAlchemy>=2.0,<3.0",
    "uvicorn[standard]>=0.30,<1.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<1.0",
    "pytest>=8.0,<9.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "postgresql_integration: requires SRE_CONTROL_PLANE_TEST_DATABASE_URL",
    "github_live_smoke: requires explicit approval and SRE_CONTROL_PLANE_GITHUB_LIVE_SMOKE=1",
]

[tool.setuptools.packages.find]
include = ["sre_control_plane*"]
