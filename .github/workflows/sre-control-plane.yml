name: SRE control-plane checks

on:
  pull_request:
    paths:
      - ".github/workflows/sre-control-plane.yml"
      - "alembic/**"
      - "sre_control_plane/**"
      - "tests/sre_control_plane/**"
      - "pyproject.toml"
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: sre_control_plane
          POSTGRES_USER: sre_control_plane
          POSTGRES_PASSWORD: sre_control_plane
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sre_control_plane -d sre_control_plane"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql+psycopg://sre_control_plane:sre_control_plane@localhost:5432/sre_control_plane
      SRE_CONTROL_PLANE_TEST_DATABASE_URL: postgresql+psycopg://sre_control_plane:sre_control_plane@localhost:5432/sre_control_plane
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: python -m pip install -e ".[dev]"
      - name: Apply migrations
        run: alembic upgrade head
      - name: Run tests
        run: python -m pytest
